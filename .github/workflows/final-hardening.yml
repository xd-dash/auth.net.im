name: final auth.net.im hardening

on:
  push:
    branches: [codex/final-hardening]
    paths:
      - .github/workflows/final-hardening.yml
      - src/**
      - test/**
      - package.json
      - package-lock.json
      - AUTH_IDIOMS.md

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run check
